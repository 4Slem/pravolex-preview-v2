document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

f=\"mailto:info@pravolex.com.ua\" style=\"color:#141A26\">info@pravolex.com.ua<\u002Fa>\n        <a href=\"tel:+380731071994\" style=\"color:#141A26\">+38 (073) 107-19-94<\u002Fa>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px 18px;padding-top:14px;border-top:1px solid #E2DED6;font-size:15px\">\n          <a href=\"viber://chat?number=%2B380731071994\">Viber<\u002Fa>\n          <a href=\"https://telegram.im/@pravolexlaw\">Telegram<\u002Fa>\n          <a href=\"https://wa.me/380731071994\">WhatsApp<\u002Fa>\n          <a href=\"https://www.facebook.com/Pravolex/\">Facebook<\u002Fa>\n          <a href=\"https://www.instagram.com/pravolex.com.ua?igsh=MXc1ZzhrdG82cndnNA==\">Instagram<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding-top:clamp(0px,6vw,92px)\">\n      <div style=\"display:grid;gap:26px;font-size:18px;line-height:1.75;color:#3A404C\">\n        <p style=\"margin:0;font:500 28px/1.45 'Cormorant Garamond',serif;color:#141A26;text-wrap:pretty\"><strong style=\"font-weight:600\">Юридична компанія Pravolex<\u002Fstrong> – це невелика команда практикуючих адвокатів, які поєднують у собі суміш молодості, жаги до перемоги, та наявності досвіду ведення складних справ у галузі кредитного, податкового, митного, корпоративного, кримінального, сімейного, господарського, житлового, адміністративного права.<\u002Fp>\n        <p style=\"margin:0;text-wrap:pretty\"><strong style=\"color:#141A26;font-weight:600\">Ми працюємо як у м. Київ, так і по всій Україні.<\u002Fstrong> Наші адвокати розробили дієві механізми захисту ваших прав. Ми маємо великий досвід представництва в судових інстанціях, досконально знаємо процесуальне законодавство та вміємо правильно його застосовувати для вирішення складних юридичних процесів.<\u002Fp>\n        <p style=\"margin:0;text-wrap:pretty\"><strong style=\"color:#141A26;font-weight:600\">За роки нашої роботи, нами було виграно більше 400 судових справ різної складності та категорії.<\u002Fstrong> Ми успішно захищаємо клієнтів у кредитних, кримінальних, податкових, сімейних, земельних, адміністративних справах.<\u002Fp>\n        <p style=\"margin:0;text-wrap:pretty\"><strong style=\"color:#141A26;font-weight:600\">Ми – адвокати у м. Києві, які люблять свою справу, і з відповідальністю та повагою ставляться до кожного свого клієнта.<\u002Fstrong> Ми працюємо чесно, відкрито та прозоро. Якщо у вас є невирішені юридичні питання, – звертайтеся до нас і отримайте надійну адвокатську допомогу.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top:40px;display:flex;flex-wrap:wrap;gap:14px\">\n        <button sc-camel-on-click=\"{{ openModal }}\" style=\"background:#1E4BA3;color:#fff;border:0;padding:19px 34px;font:500 16px/1 'Golos Text';letter-spacing:.04em;cursor:pointer;border-radius:2px\" style-hover=\"background:#0D1B33\">Дізнатися ціну<\u002Fbutton>\n        <a href=\"https://pravolex.com.ua/vigrashhni-spravi/\" style=\"color:#141A26;border:1px solid #141A26;padding:18px 34px;font:500 16px/1 'Golos Text';letter-spacing:.04em;border-radius:2px\" style-hover=\"background:#141A26;color:#fff\">Наші справи<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Principles -->\n<section data-screen-label=\"Principles\" style=\"background:#0D1B33;color:#fff\">\n  <div style=\"border-bottom:1px solid #22334F\">\n    <div style=\"max-width:1360px;margin:0 auto;padding:22px 32px;font:500 15px/1.4 'Golos Text';letter-spacing:.2em;text-transform:uppercase;color:#9FB4DE;text-align:center\">Ми вирішимо вашу справу або повернемо кошти<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1360px;margin:0 auto;padding:clamp(72px,8vw,112px) 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:clamp(40px,6vw,88px)\">\n    <div>\n      <div style=\"display:flex;align-items:center;gap:14px;font:600 13px/1 'Golos Text';letter-spacing:.18em;text-transform:uppercase;color:#9FB4DE\"><span style=\"width:32px;height:1px;background:#9FB4DE\"><\u002Fspan>Pravolex<\u002Fdiv>\n      <h2 style=\"margin:20px 0 28px;font:500 clamp(40px,4.6vw,63px)/1.05 'Cormorant Garamond',serif\">Принципи роботи Pravolex<\u002Fh2>\n      <p style=\"margin:0 0 20px;font-size:20px;line-height:1.6;color:#fff;font-weight:500;text-wrap:pretty\">Ми завжди працюємо чесно, прозоро та відкрито, а тому наші адвокати дотримуються всіх попередніх домовленостей, та в чіткі строки виконують всі свої зобовʼязання<\u002Fp>\n      <p style=\"margin:0;color:#A9B3C6;line-height:1.75;text-wrap:pretty\">Надаючи правову допомогу, наші адвокат у м. Київ кожного дня проводять різні консультації, зустрічі, переговори, а тому ми дотримуємося своїх принципів роботи, які базуються на тому, що послуги адвоката у м. Київ ніколи не повинні погіршити становище клієнта. Ми діємо за правилом не нашкодити клієнту.<\u002Fp>\n      <ul style=\"list-style:none;margin:32px 0 0;padding:0;display:grid;gap:0;border-top:1px solid #22334F\">\n        <sc-for list=\"{{ principleList }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <li style=\"padding:14px 0;border-bottom:1px solid #22334F;display:flex;gap:16px;align-items:baseline;color:#E3E8F0\"><span style=\"color:#7F9BD4;font-size:13px\">—<\u002Fspan>{{ p }}<\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n      <button sc-camel-on-click=\"{{ openModal }}\" style=\"margin-top:40px;background:#fff;color:#0D1B33;border:0;padding:19px 34px;font:500 16px/1 'Golos Text';letter-spacing:.04em;cursor:pointer;border-radius:2px\" style-hover=\"background:#E8EDF7\">Звʼязатися з адвокатом<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:#22334F;border:1px solid #22334F;align-self:start\">\n      <sc-for list=\"{{ principles }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <div style=\"background:#0D1B33;padding:32px 28px;min-height:200px;display:flex;flex-direction:column;gap:14px\" style-hover=\"background:#13233F\">\n          <span style=\"font:500 17px/1 'Cormorant Garamond',serif;color:#7F9BD4;letter-spacing:.06em\">{{ c.n }}<\u002Fspan>\n          <h3 style=\"margin:auto 0 0;font:500 32px/1.1 'Cormorant Garamond',serif\">{{ c.t }}<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:#A9B3C6\">{{ c.d }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid #22334F;overflow:hidden\">\n    <div style=\"max-width:1360px;margin:0 auto;padding:20px 32px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 28px;font:500 15px/1.4 'Golos Text';letter-spacing:.18em;text-transform:uppercase;color:#7F8AA0\">\n      <span>Юридична компанія Pravolex<\u002Fspan><span style=\"color:#2E4366\">✦<\u002Fspan><span>Адвокат<\u002Fspan><span style=\"color:#2E4366\">✦<\u002Fspan><span>Київ та вся Україна<\u002Fspan><span style=\"color:#2E4366\">✦<\u002Fspan><span>Послуги для громадян та бізнесу<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Approach -->\n<section data-screen-label=\"Approach\" style=\"max-width:1360px;margin:0 auto;padding:clamp(80px,9vw,128px) 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:clamp(40px,6vw,96px);align-items:center\">\n  <div>\n    <div style=\"display:flex;align-items:center;gap:14px;font:600 13px/1 'Golos Text';letter-spacing:.18em;text-transform:uppercase;color:#1E4BA3\"><span style=\"width:32px;height:1px;background:#1E4BA3\"><\u002Fspan>Професійний підхід до вирішення ваших справ<\u002Fdiv>\n    <h2 style=\"margin:20px 0 28px;font:500 clamp(36px,4.0vw,52px)/1.1 'Cormorant Garamond',serif;text-wrap:balance\">Адвокати нашої компанії оцінють всю складність справи, аналізують ризики та опонентів, і отримують позитивний результат<\u002Fh2>\n    <p style=\"margin:0;color:#3A404C;line-height:1.75;text-wrap:pretty\">Наша компанія надає кожному клієнту належну юридичну допомогу у різних справах та процесах. Наші адвокати неодноразово здійснювали захист та представництво інтересів відомих політиків, народних депутатів та бізнесменів. Звернувшись до нас за адвокатською допомогою, – будьте впевнені, що ми чесно та професійно виконаємо свою роботу у будь-якій точці країни як у м. Київ, так і по всій Україні.<\u002Fp>\n    <ol style=\"list-style:none;margin:36px 0 0;padding:0;display:grid;border-top:1px solid #E2DED6\">\n      <sc-for list=\"{{ approach }}\" as=\"a\" hint-placeholder-count=\"5\">\n        <li style=\"padding:14px 0;border-bottom:1px solid #E2DED6;display:flex;gap:20px;align-items:baseline\"><span style=\"font:500 17px/1 'Cormorant Garamond',serif;color:#1E4BA3;width:22px\">{{ a.n }}<\u002Fspan>{{ a.t }}<\u002Fli>\n      <\u002Fsc-for>\n    <\u002Fol>\n    <button sc-camel-on-click=\"{{ openModal }}\" style=\"margin-top:40px;background:#1E4BA3;color:#fff;border:0;padding:19px 34px;font:500 16px/1 'Golos Text';letter-spacing:.04em;cursor:pointer;border-radius:2px\" style-hover=\"background:#0D1B33\">Звʼязатися з адвокатом<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"position:relative\">\n    <img src=\"https://pravolex.com.ua/wp-content/uploads/2025/04/expert.webp\" alt=\"Адвокати нашої компанії оцінють всю складність справи, аналізують ризики та опонентів, і отримують позитивний результат\" style=\"width:100%;aspect-ratio:4/5;object-fit:cover;display:block;filter:saturate(.85)\">\n    <div style=\"position:absolute;left:-1px;bottom:-1px;background:#F5F3EE;padding:22px 28px 0 0;font:500 72px/1 'Cormorant Garamond',serif;color:#1E4BA3\">97%<div style=\"font:400 15px/1.4 'Golos Text';color:#5A6170;margin-top:6px;max-width:200px\">виграних судових справ<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA form 1 -->\n<section data-screen-label=\"CTA form\" style=\"background:#fff;border-top:1px solid #E2DED6;border-bottom:1px solid #E2DED6\">\n  <div style=\"max-width:1360px;margin:0 auto;padding:clamp(64px,7vw,96px) 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:end\">\n    <div>\n      <div style=\"display:flex;align-items:center;gap:14px;font:600 13px/1 'Golos Text';letter-spacing:.18em;text-transform:uppercase;color:#1E4BA3\"><span style=\"width:32px;height:1px;background:#1E4BA3\"><\u002Fspan>Консультація<\u002Fdiv>\n      <h2 style=\"margin:20px 0 20px;font:500 clamp(38px,4.2vw,56px)/1.05 'Cormorant Garamond',serif\">Професійна допомога адвокатів<\u002Fh2>\n      <p style=\"margin:0;color:#3A404C;max-width:520px;text-wrap:pretty\">Залишть свій контактний номер телефону і наші адвокати в Києві зв'яжуться з вами в найкоротші терміни, та нададуть професійну юридичну допомогу!<\u002Fp>\n    <\u002Fdiv>\n    <form sc-camel-on-submit=\"{{ submitForm }}\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px 28px\">\n      <input placeholder=\"Імʼя\" style=\"border:0;border-bottom:1px solid #141A26;background:transparent;padding:14px 0;font-size:18px;outline:none;color:#141A26\">\n      <input placeholder=\"Телефон\" type=\"tel\" style=\"border:0;border-bottom:1px solid #141A26;background:transparent;padding:14px 0;font-size:18px;outline:none;color:#141A26\">\n      <input placeholder=\"Коротко опишіть суть справи\" style=\"grid-column:1/-1;border:0;border-bottom:1px solid #141A26;background:transparent;padding:14px 0;font-size:18px;outline:none;color:#141A26\">\n      <div style=\"grid-column:1/-1;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;margin-top:8px\">\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#5A6170;max-width:340px\">* Юридична компанія Pravolex не збирає, не зберігає, не передає і ніде не використовує особисті дані, у тому числі номер телефону, своїх клієнтів<\u002Fp>\n        <button type=\"submit\" style=\"background:#1E4BA3;color:#fff;border:0;padding:19px 34px;font:500 16px/1 'Golos Text';letter-spacing:.04em;cursor:pointer;border-radius:2px\" style-hover=\"background:#0D1B33\">{{ sentLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Services -->\n<section data-screen-label=\"Services\" id=\"services\" style=\"max-width:1360px;margin:0 auto;padding:clamp(80px,9vw,128px) 32px\">\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:24px;margin-bottom:56px\">\n    <div>\n      <div style=\"display:flex;align-items:center;gap:14px;font:600 13px/1 'Golos Text';letter-spacing:.18em;text-transform:uppercase;color:#1E4BA3\"><span style=\"width:32px;height:1px;background:#1E4BA3\"><\u002Fspan>Pravolex<\u002Fdiv>\n      <h2 style=\"margin:20px 0 0;font:500 clamp(40px,4.6vw,63px)/1.05 'Cormorant Garamond',serif\">Комплексні юридичні послуги<\u002Fh2>\n    <\u002Fdiv>\n    <a href=\"https://pravolex.com.ua/poslugi/\" style=\"font-size:16px;font-weight:500;color:#141A26;border-bottom:1px solid #141A26;padding-bottom:4px\">Усі послуги →<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:1px;background:#E2DED6;border:1px solid #E2DED6\">\n    <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"8\">\n      <a href=\"{{ s.href }}\" style=\"background:#F5F3EE;padding:32px 28px;display:flex;flex-direction:column;gap:16px;color:#141A26;min-height:360px;transition:background .2s\" style-hover=\"background:#fff;color:#141A26\">\n        <span style=\"font:500 17px/1 'Cormorant Garamond',serif;color:#1E4BA3\">{{ s.n }}<\u002Fspan>\n        <h3 style=\"margin:0;font:500 32px/1.1 'Cormorant Garamond',serif\">{{ s.t }}<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;font-weight:500;line-height:1.5;color:#3A404C\">{{ s.d }}<\u002Fp>\n        <ul style=\"list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:16px;color:#5A6170\">\n          <sc-for list=\"{{ s.items }}\" as=\"i\" hint-placeholder-count=\"5\"><l px solid #E2DED6\">\n        <sc-for list=\"{{ teamTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ t.go }}\" style=\"border:0;padding:14px 20px;font:500 15px/1.2 'Golos Text';cursor:pointer;background:{{ t.bg }};color:{{ t.color }}\">{{ t.short }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(40px,6vw,88px);align-items:start\">\n      <div style=\"background:#EDEAE3;aspect-ratio:4/5;overflow:hidden;max-width:520px\">\n        <div role=\"img\" aria-label=\"{{ member.name }}\" style=\"width:100%;height:100%;background-size:cover;background-position:top center;background-image:{{ member.bg }}\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"margin:0;font:500 clamp(38px,4.0vw,54px)/1.05 'Cormorant Garamond',serif\">{{ member.name }}<\u002Fh3>\n        <p style=\"margin:12px 0 0;font-size:16px;color:#5A6170;letter-spacing:.01em\">{{ member.role }}<\u002Fp>\n        <p style=\"margin:36px 0 12px;font-weight:600;color:#141A26\">{{ member.title }}<\u002Fp>\n        <p style=\"margin:0;color:#3A404C;line-height:1.75;text-wrap:pretty\">{{ member.bio }}<\u002Fp>\n        <blockquote style=\"margin:36px 0 0;padding:0 0 0 0;border-top:1px solid #E2DED6;padding-top:28px;font:italic 500 28px/1.4 'Cormorant Garamond',serif;color:#1E4BA3;text-wrap:pretty\">{{ member.quote }}<\u002Fblockquote>\n        <div style=\"margin-top:36px;display:flex;gap:14px;align-items:center;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ openModal }}\" style=\"background:#0D1B33;color:#fff;border:0;padding:19px 34px;font:500 16px/1 'Golos Text';letter-spacing:.04em;cursor:pointer;border-radius:2px\" style-hover=\"background:#1E4BA3\">Стати клієнтом<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ prevMember }}\" aria-label=\"prev\" style=\"width:50px;height:50px;border:1px solid #D4CFC5;background:transparent;cursor:pointer;font-size:20px;color:#141A26;border-radius:2px\" style-hover=\"border-color:#141A26\">←<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ nextMember }}\" aria-label=\"next\" style=\"width:50px;height:50px;border:1px solid #D4CFC5;background:transparent;cursor:pointer;font-size:20px;color:#141A26;border-radius:2px\" style-hover=\"border-color:#141A26\">→<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section data-screen-label=\"FAQ\" style=\"max-width:1360px;margin:0 auto;padding:clamp(80px,9vw,128px) 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(40px,6vw,96px);align-items:start\">\n  <div style=\"position:sticky;top:120px\">\n    <div style=\"display:flex;align-items:center;gap:14px;font:600 13px/1 'Golos Text';letter-spacing:.18em;text-transform:uppercase;color:#1E4BA3\"><span style=\"width:32px;height:1px;background:#1E4BA3\"><\u002Fspan>Корисна інформація для клієнтів<\u002Fdiv>\n    <h2 style=\"margin:20px 0 36px;font:500 clamp(40px,4.6vw,63px)/1.05 'Cormorant Garamond',serif\">Поширені питання<\u002Fh2>\n    <img src=\"https://pravolex.com.ua/wp-content/uploads/2025/03/help_img.webp\" alt=\"Юридична компанія Pravolex\" style=\"width:100%;max-width:460px;aspect-ratio:1/1;object-fit:cover;display:block;filter:saturate(.85)\">\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid #141A26\">\n    <sc-for list=\"{{ faq }}\" as=\"f\" hint-placeholder-count=\"4\">\n      <div style=\"border-bottom:1px solid #D4CFC5\">\n        <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;background:transparent;border:0;padding:28px 0;cursor:pointer;text-align:left;color:#141A26\">\n          <h3 style=\"margin:0;font:500 30px/1.2 'Cormorant Garamond',serif\">{{ f.q }}<\u002Fh3>\n          <span style=\"flex:none;width:36px;height:36px;bo ze:16px;color:#3A404C\"><span style=\"color:#141A26;letter-spacing:2px\">★★★★★<\u002Fspan>Опубліковано на Google<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"columns:3 300px;column-gap:24px\">\n      <sc-for list=\"{{ reviewsShown }}\" as=\"r\" hint-placeholder-count=\"6\">\n        <figure style=\"break-inside:avoid;margin:0 0 24px;background:#F5F3EE;padding:28px;border:1px solid #DDD8CE\">\n          <div style=\"letter-spacing:2px;font-size:15px;color:#1E4BA3\">★★★★★<\u002Fdiv>\n          <blockquote style=\"margin:16px 0 24px;font-size:17px;line-height:1.7;color:#3A404C;text-wrap:pretty\">{{ r.t }}<\u002Fblockquote>\n          <figcaption style=\"display:flex;align-items:center;gap:12px;padding-top:18px;border-top:1px solid #DDD8CE\">\n            <span style=\"width:36px;height:36px;border-radius:50%;background:#0D1B33;color:#fff;display:flex;align-items:center;justify-content:center;font:500 16px/1 'Golos Text'\">{{ r.i }}<\u002Fspan>\n            <span style=\"display:grid\"><span style=\"font-weight:600;font-size:16px\">{{ r.n }}<\u002Fspan><span style=\"font-size:13px;color:#5A6170\">Google<\u002Fspan><\u002Fspan>\n          <\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasMoreReviews }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"text-align:center;margin-top:16px\">\n        <button sc-camel-on-click=\"{{ showAllReviews }}\" style=\"background:transparent;color:#141A26;border:1px solid #141A26;padding:18px 34px;font:500 16px/1 'Golos Text';letter-spacing:.04em;cursor:pointer;border-radius:2px\" style-hover=\"background:#141A26;color:#fff\">Показати всі відгуки<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Guarantee CTA -->\n<section data-screen-label=\"Guarantee CTA\" style=\"background:#0D1B33;color:#fff\">\n  <div style=\"max-width:1360px;margin:0 auto;padding:clamp(64px,7vw,96px) 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:end\">\n    <div>\n      <h2 style=\"margin:0 0 20px;font:500 clamp(36px,4.0vw,54px)/1.08 'Cormorant Garamond',serif;text-wrap:balance\">Ми вирішимо вашу справу або повернемо кошти<\u002Fh2>\n      <p style=\"margin:0;color:#A9B3C6;max-width:540px;text-wrap:pretty\">Довірте нам вирішення ваших справ і переконайтеся у нашій професійності! Ми гарантуємо чесну та кваліфіковану допомогу адвокатів на будь-яких стадіях процесу.<\u002Fp>\n    <\u002Fdiv>\n    <form sc-camel-on-submit=\"{{ submitForm }}\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px 28px\">\n      <input placeholder=\"Імʼя\" style=\"border:0;border-bottom:1px solid #4A5B7A;background:transparent;padding:14px 0;font-size:18px;outline:none;color:#fff\">\n      <input placeholder=\"Телефон\" type=\"tel\" style=\"border:0;border-bottom:1px solid #4A5B7A;background:transparent;padding:14px 0;font-size:18px;outline:none;color:#fff\">\n      <div style=\"grid-column:1/-1;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;margin-top:8px\">\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#8C97AB;max-width:340px\">* Юридична компанія Pravolex не збирає, не зберігає, не передає і ніде не використовує особисті дані, у тому числі номер телефону, своїх клієнтів<\u002Fp>\n        <button type=\"submit\" style=\"background:#fff;color:#0D1B33;border:0;padding:19px 34px;font:500 16px/1 'Golos Text';letter-spacing:.04em;cursor:pointer;border-radius:2px\" style-hover=\"background:#E8EDF7\">{{ sentLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Guarantees -->\n<section data-screen-label=\"Guarantees\" style=\"max-width:1360px;margin:0 auto;padding:clamp(80px,9vw,128px) 32px\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:32px 88px;margin-bottom:56px;align-items:end\">\n    <div>\n      <div style=\"display:flex;align-items:center;gap:14px;font:600 13px/1 'Golos Text';letter-spacing:.18em;text-transform:uppercase;color:#1E4BA3\"><span style=\"width:32px;height:1px;background:#1E4BA3\"><\u002Fspan>Наші гарантії<\u002Fdiv>\n      <h2 style=\"margin:20px 0 0;font:500 clamp(38px,4.4vw,58px)/1.06 'Cormorant Garamond',serif;text-wrap:balance\">Ми чесно, швидко та якісно виконаємо свою роботу<\u002Fh2>\n    <\u002Fdiv>\n    <div>\n      <p style=\"margin:0 0 24px;color:#3A404C;line-height:1.75;text-wrap:pretty\">Ми завжди чесні та тактовні зі своїми клієнтами. Адвокати Києва нашої компанії мають багато позитивних відгуків та хорошу репутацію в Києві, а тому ми надаємо гарантії на якісне надання юридичних послуг.<\u002Fp>\n      <button sc-camel-on-click=\"{{ openModal }}\" style=\"background:#1E4BA3;color:#fff;border:0;padding:19px 34px;font:500 16px/1 'Golos Text';letter-spacing:.04em;cursor:pointer;border-radius:2px\" style-hover=\"background:#0D1B33\">Звʼязатися з адвокатом<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:0 48px;border-top:1px solid #141A26\">\n    <sc-for list=\"{{ guarantees }}\" as=\"g\" hint-placeholder-count=\"6\">\n      <div style=\"padding:32px 0;border-bottom:1px solid #D4CFC5;display:grid;grid-template-columns:44px 1fr;gap:4px 12px\">\n        <span style=\"font:500 18px/1.6 'Cormorant Garamond',serif;color:#1E4BA3\">{{ g.n }}<\u002Fspan>\n        <div>\n          <h3 style=\"margin:0 0 10px;font:500 32px/1.1 'Cormorant Garamond',serif\">{{ g.t }}<\u002Fh3>\n          <p style=\"margin:0;font-size:17px;line-height:1.65;color:#3A404C;text-wrap:pretty\">{{ g.d }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Service links -->\n<section data-screen-label=\"Service links\" style=\"border-top:1px solid #E2DED6;background:#fff\">\n  <div style=\"max-width:1360px;marg s Text';letter-spacing:.18em;text-transform:uppercase;color:#1E4BA3\"><span style=\"width:32px;height:1px;background:#1E4BA3\"><\u002Fspan>Як ми працюємо<\u002Fdiv>\n    <h2 style=\"margin:20px 0 0;font:500 clamp(40px,4.6vw,63px)/1.05 'Cormorant Garamond',serif\">Етапи співпраці з адвокатами<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(32px,5vw,72px);align-items:start\">\n    <ol style=\"list-style:none;margin:0;padding:0;border-top:1px solid #141A26\">\n      <sc-for list=\"{{ stageTabs }}\" as=\"s\" hint-placeholder-count=\"9\">\n        <li style=\"border-bottom:1px solid #D4CFC5\">\n          <button sc-camel-on-click=\"{{ s.go }}\" style=\"width:100%;display:flex;align-items:center;gap:20px;background:transparent;border:0;padding:16px 0;cursor:pointer;text-align:left;font:500 18px/1.3 'Golos Text';color:{{ s.color }}\">\n            <span style=\"font:500 17px/1 'Cormorant Garamond',serif;width:24px;color:{{ s.numColor }}\">{{ s.n }}<\u002Fspan>\n            <span style=\"flex:1\">{{ s.t }}<\u002Fspan>\n            <span style=\"color:{{ s.numColor }}\">{{ s.arrow }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fli>\n      <\u002Fsc-for>\n    <\u002Fol>\n    <div style=\"background:#fff;border:1px solid #E2DED6;padding:clamp(32px,4vw,56px);position:sticky;top:120px\">\n      <div style=\"font:500 108px/0.9 'Cormorant Garamond',serif;color:#E2DED6\">{{ stage.n }}<\u002Fdiv>\n      <h3 style=\"margin:24px 0 20px;font:500 clamp(34px,3.3vw,45px)/1.1 'Cormorant Garamond',serif\">{{ stage.t }}<\u002Fh3>\n      <p style=\"margin:0;color:#3A404C;line-height:1.75;text-wrap:pretty\">{{ stage.d }}<\u002Fp>\n      <div style=\"margin-top:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:28px;border-top:1px solid #E2DED6\">\n        <button sc-camel-on-click=\"{{ openModal }}\" style=\"background:#1E4BA3;color:#fff;border:0;paddi якої складності. Адвокати досконально знають норми процесу, актуальну судову практику з різних питань, а також вміють правильно застосовувати прогалини законодавства.'}];\nconst STATS=[{n:'1000+',l:'Задоволених клієнтів'},{n:'400+',l:'Виграних судових справ'},{n:'1500+',l:'Наданих консультацій'}];\nconst PRINC_LIST=['Економимо кошти та нерви своїм клієнтам','Надаємо роз’яснення та консультації','Виграємо більше 97% судових справ','Здобуваємо повагу та авторитет'];\nconst PRINC=[['Договір','Ми працюємо виключно по договору з фіксацією результату'],['Результат','Ми беремо тільки ті справи, в позитивному результаті яких ми впевнені'],['Ціни','У нас мінімальні ціни на послуги адвокатів і прозора система оплати'],['Гонорар','Ми компенсуємо вам гонорар адвоката та всі судові витрати'],['Оплата','Ми надаємо вам можливість поетапної оплати гонорару'],['Підтримка','Наш адвокат, який веде вашу справу, 24/7 на зв’язку з вами']];\nconst APPROACH=['Досконало вивчаємо всі нюанси вашої справи','Витребовуємо всі додаткові матеріали','Грамотно складаємо документи','Здійснюємо ваш захист','Отримуємо результат'];\nconst SERVICES=[\n ['Громадянам','Послуги адвокатів для громадян у всіх сферах права',['Адміністративне право','Кримінальне право','Податкове право','Земельне право','Цивільне право'],'/poslugi/gromadyanam/'],\n ['Іноземцям','Послуги адвокатів для іноземців у сфері міграції',['Посвідка на проживання','Ідентифікаційний код','Дозвіл на імміграцію','Громадянство','Візи'],'/poslugi/inozemczyam/'],\n ['Військове право','Послуги адвокатів по військовим справам',['Звільнення','Відстрочки','Виплати','Штрафи','ВЛК'],'/poslugi/vijskovyj-advokat-u-kyyevi/'],\n ['Документи','Витребування, відновлення, зміна, дублікати документів',['Нотаріальні документи','Архівні документи','Судові документи','Документи РАЦС','Нострифікація'],'/poslugi/dokumenti/'],\n ['Нерухомість','Послуги адвокатів у сфері нерухомості',['Узаконення','Техпаспорт','Договора','Оцінка','Аудит'],'/poslugi/neruhomist/'],\n ['Підприємствам','Послуги адвокатів для бізнесу у всіх сферах права',['Корпоративне право','Податкове право','Стягнення боргів','Банкрутство','Ліцензії'],'/poslugi/pidpriyemstvam/'],\n ['Юридична консультація','Юридична консультація у всіх сферах права',['Онлайн консультація','Офлайн консультація','Відповідь за 5 хв.','По телефону','В офісі'],'/poslugi/yurydychna-konsultacziya-v-rezhymi-onlajn/'],\n ['Юрист Київ','Юридичні послуги для громадян та бізнесу',['Складання документів','Представництво','Консультації','Захист','Аудит'],'/poslugi/poslugy-yurysta-u-kyyevi/']];\nconst TEAM=[\n {short:'Дяченко Е. В.',name:'Дяченко Едуард Володимирович',role:'Практикуючий адвокат у м. Київ, засновник та СЕО юридичної компанії Pravolex',title:'Адвокат в Києві, СЕО і засновник юридичної компанії Pravolex',bio:'Адвокат з більш ніж 10-ти річним юридичним досвідом вирішення спорів у сфері цивільного, податкового, митного, корпоративного права, а також у сфері будівництва, нерухомості та земельних питань. Також є спеціалістом у сфері виконавчого провадження, кредитування, інвестування в активи через публічні торги. На сьогоднішній день адвокат має великий досвід ведення нестандартних та важких справ. У своєму портфелі керівник має велику кількість задоволених клієнтів та виграних судових справ.',quote:'«Є невирішене питання? Вам потрібний надійний захист адвокатів? Не знаєте як правильно вчинити? – Зверніться до адвокатів у Києві моєї команди спеціалістів! Персонально гарантую чесний розбір Вашої ситуації, якісну консультацію та швидке рішення Вашої справи!»',img:U+'/wp-content/uploads/2025/03/management_1.webp'},\n {short:'Дяченко Д. В.',name:'Дяченко Діана Вікторівна',role:'Практикуючий адвокат у м. Київ, засновник юридичної компанії Pravolex',title:'Адвокат в Києві і співзасновник юридичної компанії Pravolex.',bio:'Адвокат у сфері цивільного, сімейного, кредитного, воєнного, пенсійного права. Також адвокат є спеціалістом у сфері відновлення, витребування, зміни різноманітних документів. Має великий досвід роботи у вирішенні міграційних питань та захисту іноземців в Україні. У своєму портфелі має величезну кількість задоволених клієнтів та виграних судових справ.',quote:'«Ми цінуємо кожного свого клієнта, тому працюємо чесно і на позитивний для Вас результат!»',img:U+'/wp-content/uploads/2025/03/management_2.webp'},\n {short:'Жук К. О.',name:'Жук Катерина Олександрівна',role:'Юрист юридичної компанії Pravolex, помічник адвоката',title:'Юрист у м. Київ, який надає комплексну правову допомогу фізичним особам і бізнесу.',bio:'Працює над вирішенням податкових, цивільних, господарських та військових правових питань, здійснює супровід судових справ, надає юридичні консультації. У роботі цінує професійність, відповідальність та індивідуальний підхід до кожної справи.',quote:'“Право — це інструмент захисту, а моє завдання — допомогти ефективно ним скористатися”.',img:U+'/wp-content/uploads/2026/07/support.webp'}];\nconst FAQ=[\n {q:'Які послуги надають адвокати?',a:['Адвокати працюють із цивільними, кримінальними, корпоративними, податковими, митними, адміністративними сферами права. До штату нашої компанії входять досвідчені київські адвокати зі спеціалізацією на конкретній галузі чи суміжних напрямках. Завдяки бездоганному знанню законодавства та розумінню принципу роботи сучасних державних структур наші фахівці знаходять нетривіальні та несподівані для опонентів ходи, які виявляються в якісних юридичних послугах адвокатів.']},\n {q:'Як дізнатися ціну на послуги?',a:['Найшвидший варіант дізнатися ціну послуг адвоката – це замовити дзвінок або залишити запит на консультацію. Ціна на послуги визначається після з’ясування у вас усіх нюансів справи. Вартість адвокатських послуг є незмінною. Усі умови співробітництва та оплату ми фіксуємо у договорі. Ми маємо можливість виплачувати гонорар адвоката щомісячними платежами.']},\n {q:'Ви працюєте по Києву чи по всій Україні?',a:['Офіс нашої юридичної компанії знаходиться в Києві, як і ключові адвокати. Однак, наші адвокати Києва надають адвокатські послуги по всій Україні. Серед наших клієнтів є ті, послуги яким ми надаємо за кордоном, а також в інших містах України.']},\n {q:'Які послуги зараз самі актуальні?',a:['У юридичній компанії “Pravolex” можна замовити гарантовану та надійну допомогу в юридичних питаннях:'],list:['адвокат по адміністративним справам','адвокат по кримінальним справам','адвокат по кредитним справам','адвокат по сімейним справам','адвокат по військовим справам','адвокат по податковим та митним справах','адвокат по пенсійним справам','досудове врегулювання спорів','адвокат Київ у корпоративних справах','оформлення, відновлення, витребування будь-яких документів','апостиль та легалізація документів','юридичний супровід підприємств та угод','збір інформації про контрагентів, партнерів, роботодавців','міграційні питання','бухгалтерський супровід для підприємств'],after:'У разі, коли вам терміново потрібна юридична допомога, під час пошуку «адвокат Київ», скористатися послугами адвокатів нашої компанії – це найкращий спосіб вирішити будь-які Ваші правові питання за допомогою висококваліфікованого адвоката. Адвокати Києва компанії Pravolex надають допомогу у всіх сферах права, а також у різних складних та заплутаних ситуаціях. Щоб дізнатися про можливість співпраці, ціни, достатньо зателефонувати за вказаним номером телефону, та під час розмови з Київ адвокат отримати запрошення на особисту зустріч.'}];\nconst REVIEWS=[\n ['Ivan Kramarenko','рекомендую, адвокат був залучений до проблеми та зацікавлений у вирішенні, було знайдене оптимальне рішення з мінімумом ризиків що дало запланований результат. звертався стосовно супроводу наданню відсрочки до тцк'],\n ['Valeriya Dzigalenko','Дуже вдячна команді юридичної компанії ) знаходилася закордоном - виникли питання щодо батьківських прав та аліментів - мене проконсультували на найвищому рівні ) дуже дякую що виділили час на мене та так детально все пояснили через месенджер) від чистого серця бажаю Вам процвітання ) дуже рекомендую цю компанію )'],\n ['Pavlo Biriukov','Звертався з-за кордону за допомогою в реєстрації смерті родича на окупованій території. Весь процес був легким, інформували про перебіг на кожному кроці або надавали статус оперативно за моїм запитом. Документ отриманий в процесі вислали за кордон. Терміни були озвучені і дотримані.'],\n ['Simon Schlegel','Дуже задоволені, ретельно підготовили документі, навіть хвалили в посольстві.'],\n ['Roman Gorlinsky','Щиро дякую за допомогу! Допомогли вирішити питання з розлученням з іноземкою. Рекомендую!'],\n ['Aleksey No','Дуже швидко вирішили моє питання, рекомендую! Зробили запит до ЦНАП та отримати довідку яка мені була потрібна.'],\n ['Tetiana Specht','Дуже задоволена роботою компанії. Рекомендую клієнтам які проживають за кордоном звертатись саме до цих професіоналів. Задоволенні швидкою комунікацією та професійним підходом до всіх труднощів. Послуга в отриманні ідентифікаційного коду для громадянина України з постійним місцем проживання в Німеччині була здійснена швидко. Дякую за гарну роботу.'],\n ['Валентина Трофимець','Дуже вдячна всім співробітникам компанії, особливо Діані Вікторівній, за компетентність, оперативність, подачи інформації, відповідальність, професіональне ведення справ і саме головне терміни виконання справ.'],\n ['Сніжана Коваленко','Обращалась к адвокату по уголовным делам - Дяченко Э.В. Довольна адвокатскими услугами! Буду рекомендовать своим знакомым']];\nconst GUAR=[['Пунктуальність','Ми завжди дотримуємося пунктуальності у відносинах із клієнтами. Будь-які справи ми робимо вчасно, в обговорені із вами строки.'],['Ефективність','Ми вміємо аналізувати ситуацію, добре знаємо законодавство, не вирішуємо задачі шаблонними методами, прагнемо перемоги і це все призводить до ефективних рішень ваших справ.'],['Надійність','Завдяки нашому прагненню реально допомогти своїм клієнтам вирішити проблеми, ми на 100% віддаємся Вашій справі і тим самим надійно захищаємо ваші інтереси.'],['Чесність','Ми вибудовуємо довірчі відносини з клієнтами, дотримуючись усіх етичних норм і правил нерозголошення інформації третім особам, а також ми ніколи не беремося за справу, знаючи, що не досягнемо для вас потрібного результату.'],['Вигода','Нашим клієнтам вигідно працювати з нами, так як на всі наші послуги ми надаємо фінансову гарантію виконання поставленої задачі.'],['Якість','Ми надаємо не тільки якісні рішення справи, а й якісний юридичний сервіс, який дозволяє вам бути на зв’язку з нашими юристами 24/7/365']];\nconst LINKS=[['Юридичні послуги','law','/poslugi/gromadyanam/'],['Адвокат по кредитам','credyt','/advokat-po-kreditah-v-kiyevi/'],['Стягнення аліментів','alimenty','/advokat-po-alimentah-kyyiv/'],['Митний адвокат','mytnytcya','/advokat-po-mitnim-spravam-v-kiyevi/'],['Юрист з нерухомості','neruhomist','/advokat-z-neruhomosti-ta-budivnicztvu-v-kiyevi/'],['Апостіль','apostyl','/apostil-na-dokumenty-kiyiv/'],['Пенсійний адвокат','pension','/advokat-z-pensijnih-sprav-u-kiyevi/'],['Адвокат по сімейним справам','family','/advokat-po-simejnim-spravam-v-kiyevi/'],['Юрист по земельним питанням','earth','/advokat-po-zemelnim-spravam-u-kiyevi/'],['Адвокат по розлученню','devors','/advokat-z-rozluchen-kyyiv/'],['Податковий адвокат','tax','/advokat-po-podatkovim-spravam-v-kiyevi/'],['Адвокат по мікрозаймах','mfo','/advokat-po-kredytam-mfo/'],['Адвокат по кримінальним справам','criminal-law','/advokat-po-kriminalnih-spravah-u-kiyevi/']];\nconst CITIES=['Київ','Львів','Одеса','Дніпро','Харків','Запоріжжя','Вінниця','Житомир','Чернігів','Полтава','Черкаси','Кропивницький','Миколаїв','Херсон','Луцьк','Рівне','Тернопіль','Хмельницький','Івано-Франківськ','Ужгород','Чернівці','Суми','Ірпінь','Біла Церква','Бровари'];\nconst WHY=['Детально вивчимо вашу справу','Надамо вичерпну юридичну консультацію','Максимально всебічно прорахуємо ризики та витрати','У строки надамо необхідну юридичну допомогу','Чесні ціни та персональна відповідальність за кожного клієнта та досягнення результату','Розстрочка оплати гонорару'];\nconst STAGES=[['Аналіз справи','Адвокати нашої компанії детально вивчають всі аспекти і нюанси вашої справи. У разі необхідності, наші спеціалісти витребують потрібні документи від органів державної влади, приватних осіб. Після отримання та вивчення всіх документів, адвокат надає послуги щодо формування правової позиції.'],['Консультація','Попередньо вивчивши вашу справу, ми надаємо вичерпну юридичну консультацію із викладенням свого бачення вирішення ваших питань. Консультація може проходити як в офісі, так і дистанційно. Консультація не обмежена у часі, і її вартість може бути як оплатна, так і безкоштовна.'],['Прорахунок всіх витрат','Після надання консультації та погодження правової позиції, адвокат надає детальний план витрат, які необхідно понести у звʼязку із наданням юридичної допомоги. До витрат входять судові збори, мита, а також інші послуги. Всі витрати на правничу допомогу, наша юридична компанія стягує з опонентів та вони повертаються вам.'],['Погодження умов','Прорахувавши всі витрати, наші адвокати запропонують вам співпрацю, а саме надання правничої допомоги. Наші спеціалісти підберуть для вас найкращі умови для співпраці і нададуть фінансову гарантія на якісне виконання своєї роботи.'],['Підписання договору','Після погодження всіх умов та етапів співпраці, адвокат відображає такі умови в договорі про надання правничої допомоги, який є конфіденційний та його зміст знають виключно адвокат та клієнт. В договорі прописується його предмет, права та обов’язки сторін, а також розмір гонорару.'],['Ведення справи','Підписавши договір про надання правничої допомоги, адвокат починає процес підготовки необхідних документів та фактично здійснює захист ваших прав, та інтересів перед державними органами, приватними особами, та судами.'],['Інформування клієнта','В ході ведення справи, адвокат здійснює заходи щодо інформування клієнта про хід виконання доручення, а також про понесені фактичні витрати, направлені заяви, отримані відповіді тощо. Таке інформування відбувається будь-яким зручним для клієнта способом.'],['Досягнення позитивного результату','Після того, як були проведені всі необхідні дії, адвокат отримує для клієнта позитивне вирішення його справи та здійснює заходи щодо подальшого виконання такого рішення на користь клієнта. Адвокат веде справу до фактичного виконання рішення і отримання бажаного для клієнта результату.'],['Оплата гонорару','Після того, як справа була вирішена на користь клієнта і клієнт отримав бажаний результат, адвокат отримує свій гонорар за пророблену роботу. Гонорар може виплачуватися як разово, так і частинами, зокрема, щомісяця. Гонорар може виплачуватися як в касу, так і на розрахунковий рахунок нашої компанії, та адвоката.']];\nconst pad=i=>String(i+1).padStart(2,'0');\n\nclass Component extends DCLogic {\n  state={wide:window.innerWidth>=1100,slide:0,member:0,faq:0,stage:0,modal:false,chat:false,sent:false,allReviews:false,seo:false};\n  linksRef=React.createRef();\n  componentDidMount(){this.startAuto();this.onR=()=>{const w=window.innerWidth>=1100;if(w!==this.state.wide)this.setState({wide:w});};window.addEventListener('resize',this.onR);}\n  componentDidUpdate(p){if(p.heroAutoplay!==this.props.heroAutoplay)this.startAuto();}\n  componentWillUnmount(){clearInterval(this.t);window.removeEventListener('resize',this.onR);}\n  startAuto(){clearInterval(this.t);if(this.props.heroAutoplay??true)this.t=setInterval(()=>this.setState(s=>({slide:(s.slide+1)%3})),7000);}\n  go(i){this.setState({slide:(i+3)%3});this.startAuto();}\n  scrollLinks(d){const el=this.linksRef.current;if(el)el.scrollBy({left:d*236*2,behavior:'smooth'});}\n  renderVals(){\n    const s=this.state, nT=TEAM.length;\n    const initialCount=this.props.reviewsInitial??6;\n    return {\n      slide:SLIDES[s.slide], slideLabel:pad(s.slide)+' / 03',\n      slideDots:SLIDES.map((_,i)=>({go:()=>this.go(i),w:i===s.slide?'40px':'20px',bg:i===s.slide?'#fff':'rgba(255,255,255,.35)'})),\n      prevSlide:()=>this.go(s.slide-1), nextSlide:()=>this.go(s.slide+1),\n      stats:STATS, principleList:PRINC_LIST,\n      principles:PRINC.map(([t,d],i)=>({n:pad(i),t,d})),\n      approach:APPROACH.map((t,i)=>({n:pad(i),t})),\n      services:SERVICES.map(([t,d,items,h],i)=>({n:pad(i),t,d,items,href:U+h})),\n      teamTabs:TEAM.map((m,i)=>({short:m.short,go:()=>this.setState({member:i}),bg:i===s.member?'#0D1B33':'transparent',color:i===s.member?'#fff':'#141A26'})),\n      member:{...TEAM[s.member],bg:'url(\"'+((window.__resources||{})['team'+s.member]||TEAM[s.member].img)+'\")'},wideHeader:s.wide,\n      prevMember:()=>this.setState({member:(s.member-1+nT)%nT}), nextMember:()=>this.setState({member:(s.member+1)%nT}),\n      faq:FAQ.map((f,i)=>({...f,open:s.faq===i,sign:s.faq===i?'−':'+',hasList:!!f.list,list:f.list||[],after:f.after||'',toggle:()=>this.setState({faq:s.faq===i?-1:i})})),\n      reviewsShown:REVIEWS.slice(0,s.allReviews?REVIEWS.length:initialCount).map(([n,t])=>({n,t,i:n[0]})),\n      hasMoreReviews:!s.allReviews&&initialCount<REVIEWS.length, showAllReviews:()=>this.setState({allReviews:true}),\n      guarantees:GUAR.map(([t,d],i)=>({n:pad(i),t,d})),\n      serviceLinks:LINKS.map(([t,img,h])=>({t,bg:'url(\"'+((window.__resources||{})['sl_'+img.replace('-','_')]||U+'/wp-content/uploads/slider/'+img+'.png')+'\")',href:U+h})),\n      linksRef:this.linksRef, scrollLinksPrev:()=>this.scrollLinks(-1), scrollLinksNext:()=>this.scrollLinks(1),\n      cities:CITIES, why:WHY.map((t,i)=>({n:pad(i),t})),\n      stageTabs:STAGES.map(([t],i)=>({n:pad(i),t,go:()=>this.setState({stage:i}),color:i===s.stage?'#1E4BA3':'#141A26',numColor:i===s.stage?'#1E4BA3':'#A8ADB7',arrow:i===s.stage?'→':''})),\n      stage:{n:pad(s.stage),t:STAGES[s.stage][0],d:STAGES[s.stage][1]},\n      seoOpen:s.seo, seoLabel:s.seo?'Згорнути':'Детальніше', toggleSeo:()=>this.setState({seo:!s.seo}),\n      modalOpen:s.modal, openModal:()=>this.setState({modal:true,sent:false}), closeModal:()=>this.setState({modal:false}), stop:e=>e.stopPropagation(),\n      submitForm:e=>{e.preventDefault();this.setState({sent:true});},\n      sentLabel:s.sent?'Дякуємо! Ми зв’яжемося з вами':'Звʼязатися з адвокатом',\n      showChat:this.props.showChat??true, chatOpen:s.chat, toggleChat:()=>this.setState({chat:!s.chat})\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
